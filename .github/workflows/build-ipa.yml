name: Build iOS IPA Package

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS .IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Create Web Distribution Bundle
        run: |
          mkdir -p ios/App/App/www
          cp -r index.html css js ios/App/App/www/ || true

      - name: Build iOS Application (.app)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme LexiconForge \
                     -configuration Release \
                     -sdk iphoneos \
                     CONFIGURATION_BUILD_DIR=build/Release-iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     build

      - name: Bundle Web Assets & Package into iOS .IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "LexiconForge.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "LexiconForge.app" 2>/dev/null | head -n 1)
          fi
          echo "Found compiled app binary at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          
          # Inject web game bundle into compiled iOS App Payload
          mkdir -p Payload/LexiconForge.app/www
          cp -r index.html css js Payload/LexiconForge.app/www/
          cp -r index.html css js Payload/LexiconForge.app/
          
          echo "Packaging payload into .IPA..."
          zip -r LexiconForge.ipa Payload
          echo "Final IPA Package size:"
          ls -lh LexiconForge.ipa

      - name: Upload IPA Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LexiconForge-iOS-IPA
          path: LexiconForge.ipa
          retention-days: 90

      - name: Create GitHub Release with IPA Asset
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          files: LexiconForge.ipa
          tag_name: v1.0.0
          name: Lexicon Forge iOS Release v1.0.0
          body: |
            ## Lexicon Forge: Kinetic Word Alchemy (iOS .IPA Build)
            
            This release contains the iOS `.ipa` application package built directly via GitHub Actions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
